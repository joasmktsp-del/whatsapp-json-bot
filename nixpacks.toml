[phases.setup]
nixPkgs = ["chromium", "glib", "nss", "nspr", "atk", "at-spi2-atk", "libdrm", "libxkbcommon", "libxcomposite", "libxdamage", "libxrandr", "mesa", "egl-wayland", "libxshmfence", "cups", "cairo", "pango", "gdk-pixbuf", "gtk3"]

[phases.build]
cmds = [
  "PUPPETEER_SKIP_DOWNLOAD=true PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm install --include=dev --no-audit --no-fund",
  "echo '--- cleanup puppeteer cache ---'",
  "rm -rf /root/.cache/puppeteer 2>/dev/null || true",
  "rm -rf node_modules/puppeteer/.local-chromium 2>/dev/null || true",
  "rm -rf node_modules/whatsapp-web.js/node_modules/puppeteer/.local-chromium 2>/dev/null || true",
  "echo '--- finding chromium in /nix/store ---'",
  "find /nix/store -maxdepth 5 -type f -name chromium 2>/dev/null | head -3",
  "echo '--- build done ---'"
]
